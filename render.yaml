services:
  - type: web
    name: meeting-rooms-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-rooms-db
          property: connectionString

databases:
  - name: meeting-rooms-db
    plan: free

